# Mypy configuration for AqarIQ.
#
# Scoped to src/ (the shipped service code); tests and scripts are not
# type-checked yet — bring them in by extending `files` once annotated.
#
# Run with the project's dependencies installed (pip install -r
# requirements.txt) so real third-party types are used where libraries ship
# them; ignore_missing_imports only covers the ones that do not. That is
# exactly what CI does.
[mypy]
files = src
ignore_missing_imports = True
