# Alembic configuration — the migration environment itself lives in
# alembic/env.py (async, settings-aware). The database URL is resolved
# there (DATABASE_URL env var > this file), so nothing secret ever sits
# in a config file. Offline SQL generation works without a database:
#   alembic upgrade head --sql
[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# URL intentionally unset — env.py owns resolution (env var / Settings).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
